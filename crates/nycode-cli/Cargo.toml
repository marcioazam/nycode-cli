[package]
name = "nycode-cli"
description = "Binario nycode do NyCode CLI: harness de coding agent em terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "nycode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
# `event-stream` e o que permite ler o teclado dentro de um `select!` com o
# turno em andamento. Em modo bruto Ctrl+C chega como tecla, nao como sinal.
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.34"
nycode-agent = { version = "0.1.0", path = "../nycode-agent" }
nycode-ai = { version = "0.1.0", path = "../nycode-ai" }
nycode-auth = { version = "0.1.0", path = "../nycode-auth" }
nycode-mcp = { version = "0.1.0", path = "../nycode-mcp" }
nycode-tui = { version = "0.1.0", path = "../nycode-tui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = []
# ADR-0001: propaga a flag para o crate de auth. Nao habilitar sem ler o ADR.
subscription-oauth = ["nycode-auth/subscription-oauth"]

[dev-dependencies]
tempfile = "3.24.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
