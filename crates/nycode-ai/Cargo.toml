[package]
name = "nycode-ai"
description = "Cliente de wire multi-dialeto para o NyCode CLI: Anthropic Messages, OpenAI Chat Completions e Responses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio-test = "0.4.5"
wiremock = "0.6.5"
