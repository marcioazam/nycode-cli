# Benchmark arms (docs/bench/README.md). Every arm uses the same Claude account: the OAuth access token is read
# at run time from $BENCH_CC_CREDENTIALS (bench/arms/oauth-token.sh) and never written anywhere.
# Model and effort are fixed per round by `bench run --model`; thinking/effort below is the arm default.

[cc-vanilla]
bin = "arms/claude-vanilla"
runner = "run.py"            # ~/.claude/evals/run.py --claude-bin
version = "claude-code 2.1.323"
effort = "medium"
profile = "isolated CLAUDE_CONFIG_DIR, auto permission mode, autoupdater off"

[pi-vanilla]
bin = "arms/pi-vanilla"
runner = "run_pi.py"         # PELO_PI_BIN
version = "pi 1.5.2"
effort = "medium"            # --thinking medium
profile = "empty PI_CODING_AGENT_DIR (no packages/extensions/skills); eval-only flags dropped"

[ny-pi]
bin = "arms/ny-pi"
runner = "run_pi.py"
version = "pi 1.5.2 + pi-code 1.7.0 + this checkout"
effort = "settings.json"     # from the owner overlay
profile = "throwaway HOME: install.sh --link --apply of this tree + overlay.list; hash in .overlay-sha"

# Temporary arm (D-25, 09 §2.3): the ny-pi harness of this tree on pi 1.6.0, to separate the effect of the base from
# the effect of the migration. Same script as `ny-pi`; `env` below reaches it (run.py exports it). It needs a pi 1.6.0
# managed install (BENCH_PI_INSTALL_DIR); without the two pi 1.5.2 core patches (bin/pi skips them on another version).
# Leaves with F10.
[ny-pi-pi160]
bin = "arms/ny-pi"
runner = "run_pi.py"
version = "1.6.0"
effort = "settings.json"     # from the owner overlay
profile = "arms/ny-pi on pi 1.6.0 (BENCH_PI_VERSION): own stage bench-nypi160-<sha>, core patches skipped"
stage_prefix = "bench-nypi160"
env = { BENCH_PI_VERSION = "1.6.0" }

# The product under migration (09 §2.2): the nycode monorepo built from this checkout, no installer, no patches.
[nycode]
bin = "arms/nycode"
runner = "run_pi.py"
version = "nycode (this checkout)"
effort = "settings.json"     # from the owner layer (overlay-nycode.list)
profile = "throwaway HOME, NYCODE_CODING_AGENT_DIR in the stage; npm ci --ignore-scripts + npm run build; layer hash in .overlay-sha"
stage_prefix = "bench-nycode"

[omp]
bin = "arms/omp"
runner = "run_pi.py"         # same JSON event stream as pi (-p --mode json)
version = "omp 18.20.0"
effort = "medium"            # --thinking medium
profile = "Oh My Pi defaults, throwaway HOME per call, Auto QA off; binary from the reviewed GitHub release"
