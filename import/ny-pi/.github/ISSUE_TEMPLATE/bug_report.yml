name: Bug report
description: Something does not work as expected.
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must not be reported here. Use **Security > Report a vulnerability** instead (see SECURITY.md).
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include exact error messages and logs. Remove secrets, tokens and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Extensions
        - claude-home (rules, agents, skills, hooks)
        - Benchmark (bench/)
        - Installer
        - CI
        - Other
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Blocks all use, data loss or wrong results
        - Major feature broken, no workaround
        - Feature broken, workaround exists
        - Minor or cosmetic
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ny-pi commit and pi version
      description: "Output of `git rev-parse --short HEAD` in your checkout and `pi --version`."
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node.js version
      placeholder: "Linux x86_64, Node 22.19"
