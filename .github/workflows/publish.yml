# Release channel (D-17, D-42): a `v*` tag builds the self-contained binaries, smoke-tests them on three hosted OSes,
# attests their provenance and publishes the GitHub Release. No registry, no long-lived token: the only secret is the
# run's own GITHUB_TOKEN. Verify a download with `gh attestation verify <file> -R marcioazam/nycode`.
# Adapted from the removed build-binaries.yml (git show f523ebd25^:.github/workflows/build-binaries.yml), without npm and R2.
name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v2.0.0); it must already exist"
        required: true
        type: string
      source_ref:
        description: "Source ref to build (defaults to the tag; use only for release recovery)"
        required: false
        type: string

permissions: {}

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
            echo "::error::Tag '${RELEASE_TAG}' is not vMAJOR.MINOR.PATCH"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true # no cache restore in a release build (cache poisoning)

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false # no cache restore in a release build (cache poisoning)

      - name: Hydrate release model data
        run: npm run hydrate:model-data

      - name: Create source archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          ./scripts/create-source-archive.sh \
            --version "${VERSION}" \
            --ref HEAD \
            --out "release-assets/nycode-${VERSION}-source.tar.gz"

      - name: Build binaries from source archive
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          build_root="$(mktemp -d)"
          trap 'rm -rf "${build_root}"' EXIT
          tar -xzf "release-assets/nycode-${VERSION}-source.tar.gz" -C "${build_root}"
          "${build_root}/nycode-${VERSION}/scripts/build-binaries.sh" \
            --offline-model-data \
            --out "${GITHUB_WORKSPACE}/packages/coding-agent/binaries"

      - name: Prepare release payload
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          node scripts/release-notes.mjs extract --version "${VERSION}" --tag "${RELEASE_TAG}" --out release-assets/RELEASE_NOTES.md

          binary_assets=(
            nycode-darwin-arm64.tar.gz
            nycode-darwin-x64.tar.gz
            nycode-linux-x64.tar.gz
            nycode-linux-arm64.tar.gz
            nycode-windows-x64.zip
            nycode-windows-arm64.zip
          )
          for asset in "${binary_assets[@]}"; do
            test -f "packages/coding-agent/binaries/${asset}"
            cp "packages/coding-agent/binaries/${asset}" release-assets/
          done

          cd release-assets
          sha256sum "nycode-${VERSION}-source.tar.gz" "${binary_assets[@]}" > SHA256SUMS

      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Smoke test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - macos-15
          - windows-2025
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout smoke tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Extract current-platform binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          runtime_platform="$(node -p "process.platform + '-' + process.arch")"
          case "${runtime_platform}" in
            darwin-arm64|darwin-x64|linux-arm64|linux-x64)
              archive="release-assets/nycode-${runtime_platform}.tar.gz"
              binary="extracted/nycode/nycode"
              ;;
            win32-arm64|win32-x64)
              archive="release-assets/nycode-windows-${runtime_platform#win32-}.zip"
              binary="extracted/nycode.exe"
              ;;
            *)
              echo "::error::Unsupported runner platform ${runtime_platform}"
              exit 1
              ;;
          esac

          mkdir -p extracted
          if [[ "${archive}" == *.zip ]]; then
            ARCHIVE_PATH="$(cygpath -w "${archive}")"
            DESTINATION_PATH="$(cygpath -w extracted)"
            export ARCHIVE_PATH DESTINATION_PATH
            # shellcheck disable=SC2016 # $env: is PowerShell syntax, it must not expand in bash
            powershell.exe -NoProfile -NonInteractive -Command \
              'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
          else
            tar -xf "${archive}" -C extracted
          fi
          echo "binary=${binary}" >> "${GITHUB_OUTPUT}"

      - name: Smoke-test binary
        shell: bash
        env:
          BINARY: ${{ steps.binary.outputs.binary }}
        run: |
          set -euo pipefail
          "${BINARY}" --help
          version_output="$("${BINARY}" --version)"
          echo "${version_output}"
          [[ "${version_output}" == *"${RELEASE_TAG#v}"* ]] || {
            echo "::error::--version does not report ${RELEASE_TAG#v}"
            exit 1
          }
          node scripts/smoke-test-codemode-binary.mjs "${BINARY}"

  release:
    name: Attest and publish the GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build
      - smoke
    timeout-minutes: 15
    permissions:
      contents: write # create, upload to and publish the Release
      id-token: write # keyless signing of the attestations
      attestations: write # store the attestations
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate release payload
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_TAG#v}"
          for asset in "nycode-${VERSION}-source.tar.gz" nycode-darwin-arm64.tar.gz nycode-darwin-x64.tar.gz \
            nycode-linux-x64.tar.gz nycode-linux-arm64.tar.gz nycode-windows-x64.zip nycode-windows-arm64.zip \
            SHA256SUMS RELEASE_NOTES.md; do
            test -f "${asset}"
          done
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # the first glob also matches the source archive
          subject-path: |
            release-assets/nycode-*.tar.gz
            release-assets/nycode-*.zip
            release-assets/SHA256SUMS

      - name: Create draft Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_TAG#v}"
          release_assets=(
            "nycode-${VERSION}-source.tar.gz"
            nycode-darwin-arm64.tar.gz
            nycode-darwin-x64.tar.gz
            nycode-linux-x64.tar.gz
            nycode-linux-arm64.tar.gz
            nycode-windows-x64.zip
            nycode-windows-arm64.zip
            SHA256SUMS
          )

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft Release asset set does not match the expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
