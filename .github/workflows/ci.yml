name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A fila de merge e a peca do lado remoto que impoe o mesmo bloqueio que os
  # hooks locais impoem do lado do desenvolvedor: sem isto o "CI verde para
  # merge" so valia na maquina de quem commitou.
  merge_group:

# Minimo por padrao (nenhum job aqui escreve no repositorio); o unico caso que
# precisaria de mais — publicar — vive em release.yml, nao aqui.
permissions:
  contents: read

# Cancela a execucao anterior do mesmo ref quando uma nova chega. Sem isto,
# dois pushes seguidos rodam a suite inteira duas vezes e o runner mais lento
# decide qual checagem aparece por ultimo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  # O teto de sete arquivos por diretorio, o teto de 500 linhas por arquivo
  # (GATE-07/ARCH-11 do padrao externo, com ratchet), a atualidade do
  # test_map (AI-10), o grafo de dependencia entre crates (GATE-15), a
  # complexidade cognitiva/ciclomatica por funcao (GATE-05/GATE-06, tambem
  # com ratchet) e a duplicacao de codigo (GATE-08). Job proprio e nao passo
  # do `lint` porque nenhum depende de toolchain nem de cache: reprovam em
  # segundos, e separado dizem o que reprovou sem se misturar a um erro de
  # compilacao.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/layout-gate-test.sh
      - run: scripts/layout-gate.sh
      - run: scripts/file-length-gate-test.sh
      - run: scripts/file-length-gate.sh
      - run: scripts/gen-test-map-test.sh
      - run: scripts/gen-test-map.sh --check
      - run: scripts/architecture-boundary-gate-test.sh
      - run: scripts/architecture-boundary-gate.sh
      # codemetrics (github.com/richardwooding/codemetrics) nao publica
      # action.yml na raiz do jeito que este repositorio fixa por SHA
      # (ADR-0030) exigiria para uma composite action de terceiro; o binario
      # e baixado direto do release e o digest e conferido contra o valor
      # publicado, mesmo padrao ja usado para actionlint acima.
      - name: instala codemetrics (digest conferido contra o release)
        env:
          CODEMETRICS_VERSION: "0.12.5"
          CODEMETRICS_SHA256: c5f05849f82cdb0fe0f6ffa1171fe62a2424bedce619cf4bf3693723886f7dc4
        run: |
          curl -fsSL -o codemetrics.tar.gz \
            "https://github.com/richardwooding/codemetrics/releases/download/v${CODEMETRICS_VERSION}/codemetrics_${CODEMETRICS_VERSION}_linux_amd64.tar.gz"
          echo "${CODEMETRICS_SHA256}  codemetrics.tar.gz" | sha256sum -c -
          tar xzf codemetrics.tar.gz codemetrics
          sudo mv codemetrics /usr/local/bin/codemetrics
      - run: scripts/complexity-gate-test.sh
      - run: scripts/complexity-gate.sh
      # jscpd (github.com/kucherenko/jscpd) tambem nao publica action.yml.
      # Diferente de codemetrics, o release nao traz um checksums.txt
      # assinado pelo projeto -- o digest abaixo foi calculado por este
      # repositorio no momento da adocao (sha256sum sobre o asset baixado de
      # releases/download, a mesma API do GitHub que qualquer verificacao
      # usaria). Protege contra o asset mudar sem bump de versao; nao e' uma
      # confirmacao de terceiro independente do GitHub, que codemetrics tem
      # e este nao.
      - name: instala jscpd (digest calculado nesta adocao, sem checksums.txt oficial)
        env:
          JSCPD_VERSION: "5.0.15"
          JSCPD_SHA256: bf46eef9d74e15af108e5fdb21ecf4f8679c54f10814815cb037209332d66ec4
        run: |
          curl -fsSL -o jscpd.tar.gz \
            "https://github.com/kucherenko/jscpd/releases/download/v${JSCPD_VERSION}/jscpd-linux-x64-gnu.tar.gz"
          echo "${JSCPD_SHA256}  jscpd.tar.gz" | sha256sum -c -
          tar xzf jscpd.tar.gz jscpd
          sudo mv jscpd /usr/local/bin/jscpd
      - run: scripts/duplication-gate-test.sh
      - run: scripts/duplication-gate.sh

  # Teto de PR assistido por IA (GATE-11/AI-01) e idade minima de dependencia
  # nova (SP-04). So aqui, e nao em scripts/ci-local.sh --full: a base certa
  # de comparacao (o alvo real do PR, que pode nao ser main num PR empilhado
  # sobre outro) so e conhecida de verdade dentro do contexto de um pull
  # request -- e' o `github.base_ref` do evento. Localmente nao ha como
  # decidir isso sem adivinhar, e um gate que adivinha errado e pior que
  # nenhum. `fetch-depth: 0` porque os dois gates precisam do historico
  # completo para achar o merge-base.
  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/agent-pr-size-gate-test.sh
      - run: scripts/agent-pr-size-gate.sh "origin/${BASE_REF}" "HEAD"
        env:
          # Nunca interpolar github.base_ref direto no run: -- e' controlado
          # por quem abre o PR (nome de branch), e um valor assim direto no
          # shell e' injecao de template (zizmor, template-injection). Via
          # env, o bash trata como dado.
          BASE_REF: ${{ github.base_ref }}
      # Idade minima de dependencia nova (SP-04). Mesmo job: ja tem o
      # fetch-depth 0 e a base real do PR que o gate tambem precisa.
      - run: scripts/dependency-age-gate-test.sh
      - run: scripts/dependency-age-gate.sh "origin/${BASE_REF}" "HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}

  # Lint do proprio workflow: sem toolchain, sem cache, reprova em segundos.
  # Fecha o mesmo argumento que `layout` ja fecha, aplicado aos workflows.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 (nao o 1 default) porque gitleaks-action varre o range
      # entre o commit-base do PR e o head; com checkout raso essa base nao
      # existe localmente e o `git log` da action falha com "unknown
      # revision" antes mesmo de escanear — achado so na primeira execucao
      # real de CI, que nenhuma revisao local via.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # rhysd/actionlint nao publica action.yml/action.yaml (so um Dockerfile na
      # raiz): um `uses:` cairia no fallback de container action e nao poe o
      # binario no PATH do runner, entao `run: actionlint` sozinho falharia com
      # "comando nao encontrado" e derrubaria o job antes de zizmor/pinact/
      # gitleaks rodarem. O binario e baixado direto do release e o digest e
      # conferido contra o valor publicado, no mesmo padrao que
      # perf-baseline.yml ja usa para o binario do concorrente — o script
      # instalador oficial do projeto nao confere digest nenhum, so teria
      # movido o problema. v1.7.12 e nao v1.7.7 (a tag que este repositorio
      # fixava antes desta correcao) porque o dataset de labels de runner do
      # v1.7.7 e mais velho que `macos-15-intel`, usado em release.yml, e
      # reprova esse label como desconhecido — verificado rodando as duas
      # versoes contra os workflows deste repositorio.
      - name: instala actionlint (digest conferido contra o release)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - run: ./actionlint
      # Auto-teste do gate local: ci-local.sh nao pode chamar isto de dentro de
      # full() (a copia sandboxed reentraria em si mesma, sem fundo), entao
      # roda aqui — o mesmo motivo pelo qual layout-gate-test.sh roda tanto
      # daqui quanto de dentro de full().
      - run: scripts/ci-local-test.sh
      - uses: taiki-e/install-action@41f31fbbf48a4bea86678f0220274a1f7d1e2e50  # zizmor
      - run: zizmor --no-progress --collect all --min-severity medium .
      # pinact-action instala o binario via aqua e chama `aqua exec -- pinact`
      # por dentro dos seus proprios passos — nao poe `pinact` no PATH do job
      # para um `run:` seguinte usar, e um `pinact run -fix=false
      # --verify-comment` depois deste passo falhava com "command not found".
      # `verify: true` pede a mesma verificacao (`--verify-comment` e so um
      # alias de `--verify`) por dentro da propria action, que ja sabe onde o
      # binario esta. `fix: false` desliga o autofix-e-push que e o padrao da
      # action — a checagem sintatica que nao precisa de rede ja roda em
      # ci-local.sh, entao so a verificacao contra a tag upstream falta aqui.
      - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a  # v3.0.0
        with:
          fix: "false"
          verify: "true"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # Sem bubblewrap os testes de confinamento de
      # crates/nycode-agent/src/tools/bash.rs detectam ausencia de sandbox e
      # pulam o proprio corpo. `ubuntu-latest` nao vem com o pacote, e mesmo
      # instalado o bwrap falhava ao montar o namespace de rede isolado
      # ("Failed RTM_NEWADDR: Operation not permitted") — a restricao padrao
      # do Ubuntu 24.04 contra userns nao privilegiado, por dois mecanismos
      # de kernel possiveis (AppArmor e o sysctl mais antigo). As duas linhas
      # sao so ambiente de CI, nao mexem em codigo de producao nem no
      # confinamento que o binario de fato aplica: liberam no runner a mesma
      # capacidade que ja existe, sem restricao, na maquina de quem
      # desenvolve.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: cargo test --workspace --all-features

  # ADR-0001: o build padrao nao pode arrastar OAuth de assinatura. Se esta
  # verificacao passar a falhar, alguem tornou a feature transitivamente default.
  default-build-has-no-subscription-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - name: oauth2 fora da arvore de dependencias padrao
        run: |
          if cargo tree --workspace --edges normal | grep -qi '^\s*[|`-]*\s*oauth2 '; then
            echo "::error::a crate oauth2 entrou no build padrao; ver ADR-0001"
            cargo tree --workspace --edges normal --invert oauth2 || true
            exit 1
          fi
          echo "build padrao limpo"
      - name: a feature ainda compila quando pedida explicitamente
        run: cargo check --workspace --features nycode-cli/subscription-oauth
      # O ADR-0001 cita um kill-switch como mitigacao. Ele nao pode disparar hoje
      # porque nenhum token de assinatura circula: o modulo nao tem consumidor. A
      # mitigacao real, enquanto isso, e a inercia — e e ela que este check
      # protege. No dia em que alguem ligar o fluxo de OAuth, isto reprova e
      # obriga a ligar tambem `State::blocked` a rejeicao do provider.
      - name: o caminho de assinatura continua inerte
        run: |
          consumidores=$(grep -rln --include='*.rs' 'subscription::' crates/ \
            | grep -v 'crates/nycode-auth/src/subscription.rs' || true)
          if [ -n "$consumidores" ]; then
            echo "::error::o modulo de assinatura ganhou consumidor: $consumidores"
            echo "Antes que isso valha: ligue State::blocked ao caminho que detecta"
            echo "rejeicao do provider, e atualize o ADR-0001 e este check."
            exit 1
          fi
          echo "caminho inerte; o kill-switch nao tem o que disparar"

  # Mutation testing por diff (GATE-04). So em pull_request, pelo mesmo
  # motivo dos outros gates PR-only: a base real so e conhecida no evento.
  # Mutar o workspace inteiro nao cabe aqui -- 2144 mutantes contados no dia
  # em que este gate foi desenhado, cada um exigindo rebuild e retest
  # completo -- entao `cargo mutants --in-diff` restringe ao que o PR tocou.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@77ef4f772e4d87962d8178aaa1b3a4aa037b94c3  # cargo-mutants
      - run: scripts/mutation-gate-test.sh
      - run: scripts/mutation-gate.sh "origin/${BASE_REF}" "HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # fetch-depth 0: o passo de cobertura de diff (GATE-01), mais abaixo,
          # precisa do historico completo para achar o merge-base com a base
          # real do PR.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@3ee274a48739f9c49921feda61cb199dc7520e62  # cargo-llvm-cov
      # Mesma razao do job `test`: sem bubblewrap funcionando os testes de
      # confinamento pulam o proprio corpo e o piso por arquivo em
      # crates/nycode-agent/src/tools/bash.rs reprova sem nenhuma linha de
      # producao ter mudado.
      - run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y bubblewrap
      # Antes de medir, provar que quem mede ainda reprova. Um gate que perdeu a
      # capacidade de falhar aprova o workspace inteiro em silencio, e roda antes
      # da medicao porque custa segundos e a medicao custa minutos.
      - run: scripts/coverage-gate-test.sh
      - run: cargo llvm-cov --workspace --all-features --json --output-path coverage.json
      - run: scripts/coverage-gate.sh coverage.json
      # Cobertura de diff (GATE-01), so em pull_request: precisa da base real
      # do PR, que so o evento conhece. `cargo llvm-cov report` reaproveita os
      # dados de perfil do passo acima -- nao roda os testes de novo.
      - if: github.event_name == 'pull_request'
        run: scripts/diff-coverage-gate-test.sh
      - if: github.event_name == 'pull_request'
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - if: github.event_name == 'pull_request'
        run: scripts/diff-coverage-gate.sh lcov.info "origin/${BASE_REF}" "HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # NFR-8, e a unica forma de a precedencia ser observavel em vez de prosa: o
    # resultado de performance nao e sequer produzido enquanto a politica de
    # dependencias nao passa. Serializa dois jobs que eram paralelos e atrasa o
    # retorno de perf no PR pelo tempo do `cargo deny` — o preco esta declarado
    # nas consequencias negativas do ADR-0011.
    needs: [supply-chain]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # Nenhum dos dois vem na imagem, e sem eles o perf-gate falha fechado, que
      # e o que se quer: requisito sem medicao e requisito sem gate.
      # `hyperfine` mede o tempo (ADR-0012); `/usr/bin/time` mede o RSS.
      - run: sudo apt-get update && sudo apt-get install -y time hyperfine
      # Antes de medir, provar que quem mede ainda reprova, como o job
      # `coverage` faz. Roda primeiro porque custa segundos e o build custa
      # minutos, e porque um gate que perdeu a capacidade de falhar aprova
      # qualquer regressao em silencio.
      - run: scripts/perf-gate-test.sh
      - run: cargo build --release
      # A sonda de startup resolve credencial, e em CI nao ha cofre do sistema.
      # Sem isto o gate mediria o custo de desistir, nao o de montar a sessao.
      - run: scripts/perf-gate.sh
        env:
          NYCODE_API_KEY: perf-gate

  # Uma dependencia com aviso de seguranca, ou com licenca incompativel, e um
  # defeito que nenhum teste pega.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - uses: taiki-e/install-action@be8e48a54f508d12604e2a74fda853e27889c2dc  # cargo-deny
      - run: cargo deny check

  # NFR-4 e NFR-6. A comparacao completa exige o harness de referencia; o
  # gateway deixou de ser bloqueio, porque o `nycode-parity-fixture` serve um
  # deterministico e local. Sem a referencia o gate roda em modo instrumento,
  # que prova que o harness observa o candidato — e diz em voz alta que isso nao
  # e paridade. Um harness que nao pode falhar e pior que nenhum, porque compra
  # confianca sem entregar evidencia.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      - run: cargo build -p nycode-cli -p nycode-parity
      - name: o harness ainda acusa divergencia
        run: cargo test -p nycode-parity
      - run: scripts/parity-gate.sh
        env:
          NYCODE_BASE_URL: ${{ vars.PARITY_BASE_URL }}
          NYCODE_API_KEY: ${{ secrets.PARITY_API_KEY }}
          PARITY_REFERENCE: ${{ vars.PARITY_REFERENCE }}

  # Canal de distribuicao adicional, nao o principal (ver comentario no topo
  # do Dockerfile) -- so builda e faz smoke test, nunca publica. Publicar
  # exige pedido explicito do usuario, mesma regra ja aplicada ao resto
  # deste repositorio.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # hadolint (github.com/hadolint/hadolint) tambem nao publica
      # checksums.txt -- mesmo problema ja resolvido pro actionlint acima
      # (linha ~125), mesmo padrao replicado aqui.
      - name: instala hadolint (digest calculado nesta adocao, sem checksums.txt oficial)
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          chmod +x hadolint
          sudo mv hadolint /usr/local/bin/hadolint
      - run: hadolint Dockerfile
      - run: docker build -t nycode:ci .
      - name: smoke test -- a imagem builda e roda
        run: |
          version_output="$(docker run --rm nycode:ci --version)"
          echo "${version_output}"
          [[ -n "${version_output}" ]]
