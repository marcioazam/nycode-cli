name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Minimo no topo; `publish` escala para `contents: write` porque e o unico job
# que de fato publica. `build` so compila e sobe artefato de execucao — nao
# precisa de mais que leitura.
permissions:
  contents: read

# Uma tag nao se publica duas vezes por engano: cancelar uma execucao de
# release em andamento e mais perigoso que deixa-la terminar, entao aqui nao
# ha `cancel-in-progress`. O grupo ainda serializa reexecucoes da mesma tag.
concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.target }}
      # Sem cache aqui, de proposito: este e o workflow que publica o binario, e
      # um cache restaurado durante um build de publicacao e superficie para
      # envenenamento de artefato — outro job grava o cache, este o le e o
      # que sai dele vira release. O custo e minutos a mais por tag, que e raro;
      # o ganho e o artefato publicado nunca depender de cache gravavel por
      # fora deste job.

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }} --bin nycode

      # NFR-3: o binario precisa rodar de qualquer diretorio, sem arquivos
      # irmaos. O harness de referencia falha exatamente aqui, entao a
      # verificacao acontece antes de publicar, nao depois de um relato.
      # Vale para os quatro alvos: cada um compila no proprio runner nativo,
      # entao nao ha artefato que saia sem esta checagem.
      - name: Verificar que o binario e auto-contido
        run: |
          install -m755 "target/${{ matrix.target }}/release/nycode" /tmp/nycode
          cd / && /tmp/nycode --version

      - name: Empacotar
        run: |
          staging="nycode-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/nycode" "$staging/"
          cp LICENSE NOTICE README.md "$staging/"
          tar -czf "$staging.tar.gz" -C "$staging" .
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nycode-${{ matrix.target }}
          path: |
            nycode-${{ matrix.target }}.tar.gz
            nycode-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
