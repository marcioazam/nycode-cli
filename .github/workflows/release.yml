name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Minimo no topo; `publish` escala para `contents: write` porque e o unico job
# que de fato publica. `build` so compila e sobe artefato de execucao — nao
# precisa de mais que leitura.
permissions:
  contents: read

# Uma tag nao se publica duas vezes por engano: cancelar uma execucao de
# release em andamento e mais perigoso que deixa-la terminar, entao aqui nao
# ha `cancel-in-progress`. O grupo ainda serializa reexecucoes da mesma tag.
concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: ${{ matrix.target }}
      # Sem cache aqui, de proposito: este e o workflow que publica o binario, e
      # um cache restaurado durante um build de publicacao e superficie para
      # envenenamento de artefato — outro job grava o cache, este o le e o
      # que sai dele vira release. O custo e minutos a mais por tag, que e raro;
      # o ganho e o artefato publicado nunca depender de cache gravavel por
      # fora deste job.

      - name: Validar que a tag corresponde ao manifesto
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(cargo metadata --locked --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "nycode") | .version')"
          test -n "${actual}"
          test "${expected}" = "${actual}"

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }} --bin nycode

      # NFR-3: o binario precisa rodar de qualquer diretorio, sem arquivos
      # irmaos. O harness de referencia falha exatamente aqui, entao a
      # verificacao acontece antes de publicar, nao depois de um relato.
      # Vale para os quatro alvos: cada um compila no proprio runner nativo,
      # entao nao ha artefato que saia sem esta checagem.
      - name: Verificar que o binario e auto-contido
        run: |
          install -m755 "target/${{ matrix.target }}/release/nycode" /tmp/nycode
          cd / && /tmp/nycode --version

      - name: Empacotar
        run: |
          staging="nycode-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/nycode" "$staging/"
          cp LICENSE NOTICE README.md "$staging/"
          tar -czf "$staging.tar.gz" -C "$staging" .
           shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Gerar SBOM SPDX
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532  # v0.20.0
        with:
          file: Cargo.lock
          format: spdx-json
          output-file: nycode-${{ matrix.target }}.sbom.spdx.json
          artifact-name: nycode-${{ matrix.target }}.sbom.spdx.json
          upload-release-assets: false

      - name: Escanear SBOM sem HIGH ou CRITICAL
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: nycode-${{ matrix.target }}.sbom.spdx.json
          output-format: sarif
          output-file: nycode-${{ matrix.target }}.scan.sarif
          severity-cutoff: high
          fail-build: true

      - name: Atestar o tarball publicado
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: nycode-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nycode-${{ matrix.target }}
          path: |
            nycode-${{ matrix.target }}.tar.gz
            nycode-${{ matrix.target }}.tar.gz.sha256
            nycode-${{ matrix.target }}.sbom.spdx.json
            nycode-${{ matrix.target }}.scan.sarif

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
