name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compilar
        run: cargo build --release --target ${{ matrix.target }} --bin nycode

      # NFR-3: o binario precisa rodar de qualquer diretorio, sem arquivos
      # irmaos. O harness de referencia falha exatamente aqui, entao a
      # verificacao acontece antes de publicar, nao depois de um relato.
      # Vale para os quatro alvos: cada um compila no proprio runner nativo,
      # entao nao ha artefato que saia sem esta checagem.
      - name: Verificar que o binario e auto-contido
        run: |
          install -m755 "target/${{ matrix.target }}/release/nycode" /tmp/nycode
          cd / && /tmp/nycode --version

      - name: Empacotar
        run: |
          staging="nycode-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/nycode" "$staging/"
          cp LICENSE NOTICE README.md "$staging/"
          tar -czf "$staging.tar.gz" -C "$staging" .
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: nycode-${{ matrix.target }}
          path: |
            nycode-${{ matrix.target }}.tar.gz
            nycode-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
