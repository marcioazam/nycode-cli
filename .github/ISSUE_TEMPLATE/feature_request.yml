name: Feature request
description: Propose a new capability or an improvement.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes that show the request is done.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Effect on cost and the benchmark
      description: Any change to the always-loaded prompt, turns or cost per task. Say "unknown" if you do not know.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
