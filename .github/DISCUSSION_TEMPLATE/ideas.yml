title: "[Idea] "
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like ny-pi to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: The workflow it improves and how you would tell it worked.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
